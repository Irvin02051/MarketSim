name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: backend
    env:
      MARKET_DATA_PROVIDER: demo
      RESEARCH_ENABLED: 'false'
      REAL_HISTORY_ENABLED: 'false'
      REAL_RESEARCH_ENABLED: 'false'
      ALPHA_VANTAGE_API_KEY: ''
      GEMINI_API_KEY: ''
      SUPABASE_URL: ''
      SUPABASE_PUBLISHABLE_KEY: ''
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff
        run: python -m ruff check app tests
      - name: Mocked backend tests
        run: python -m unittest discover -s tests -v
      - name: Dependency consistency
        run: python -m pip check

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: frontend
    env:
      VITE_REAL_HISTORY_ENABLED: 'false'
      VITE_REAL_RESEARCH_ENABLED: 'false'
      VITE_SUPABASE_URL: ''
      VITE_SUPABASE_PUBLISHABLE_KEY: ''
      VITE_AUTH_CALLBACK_URL: ''
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Frontend tests
        run: npm test
      - name: Frontend lint
        run: npm run lint
      - name: Environment-isolated production build
        run: |
          set -euo pipefail
          validation_dir=$(mktemp -d)
          trap 'rm -rf "$validation_dir"' EXIT
          validation_config="$validation_dir/vite.config.mjs"
          node --input-type=module - "$validation_config" <<'JS'
          import { writeFileSync } from 'node:fs'
          import { resolve } from 'node:path'
          import { pathToFileURL } from 'node:url'
          const source = pathToFileURL(resolve('vite.config.ts')).href
          writeFileSync(process.argv[2], `import config from ${JSON.stringify(source)};\nexport default { ...config, envDir: false };\n`)
          JS
          env -i PATH="$PATH" HOME="$HOME" \
            VITE_REAL_HISTORY_ENABLED=false VITE_REAL_RESEARCH_ENABLED=false \
            npm run build -- --config "$validation_config"
